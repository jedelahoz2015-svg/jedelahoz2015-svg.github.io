<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 48px 0; text-align: center; color: #cfdbf2;

    .nf h1 { margin-top: 12px; font-size: clamp(1.6rem, 4vw, 2.4rem); color: #fff; }
    .nf p { margin: 14px auto 32px; max-width: 460px; color: #9fb0cf; }

<body>
  <main class="nf">
    <div class="container">
      <p class="nf__code" aria-hidden="true">404</p>
      <h1>Página no encontrada</h1>

      <a class="btn btn--primary" href="/">Volver al inicio</a>
